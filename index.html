<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>高雄市小港區天氣預報</title>
<style>
  :root {
    --bg: #eef2f7;
    --panel: #ffffff;
    --panel-2: #f5f7fb;
    --text: #1c1e21;
    --sub: #6b7280;
    --line: #e3e7ee;
    --hot: #ef6c2f;
    --cold: #2f7ef0;
    --rain: #3b82f6;
    --rain-bg: #dbe7ff;
    --mm: #0d9488;
    --mid: #16a34a;
    --feel: #9333ea;
    --err: #dc2626;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --shadow: 0 10px 28px rgba(0, 0, 0, 0.10);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a;
      --panel: #1f2227;
      --panel-2: #272b32;
      --text: #f1f3f5;
      --sub: #9aa1ad;
      --line: #343944;
      --hot: #ff8a4c;
      --cold: #6aa6ff;
      --rain: #5b95f8;
      --rain-bg: #27385f;
      --mm: #2dd4bf;
      --mid: #4ade80;
      --feel: #c084fc;
      --err: #f87171;
      --accent: #3b82f6;
      --accent-hover: #5b95f8;
      --shadow: 0 10px 28px rgba(0, 0, 0, 0.5);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    padding: 20px 14px 40px;
    min-height: 100vh;
  }
  .wrap { max-width: 860px; margin: 0 auto; }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }
  h1 { font-size: 1.5rem; margin: 0; }
  .subtitle { color: var(--sub); font-size: 0.88rem; margin-top: 4px; }
  button.refresh {
    font: inherit;
    font-size: 0.95rem;
    border: none;
    background: var(--accent);
    color: #fff;
    padding: 10px 18px;
    border-radius: 12px;
    cursor: pointer;
    transition: background 0.12s, transform 0.06s;
  }
  button.refresh:hover { background: var(--accent-hover); }
  button.refresh:active { transform: scale(0.96); }
  button.refresh:disabled { opacity: 0.6; cursor: default; }
  button.refresh:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  .card {
    background: var(--panel);
    border-radius: 20px;
    padding: 18px;
    box-shadow: var(--shadow);
    margin-bottom: 16px;
  }
  .now {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .now-main { display: flex; align-items: center; gap: 14px; }
  .now-icon { font-size: 3.4rem; line-height: 1; }
  .now-temp { font-size: 2.8rem; font-weight: 600; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .now-desc { color: var(--sub); font-size: 0.95rem; margin-top: 2px; }
  .now-side { text-align: right; font-size: 0.95rem; line-height: 1.8; }
  .now-side b { font-variant-numeric: tabular-nums; }

  .section-title { font-size: 1.05rem; font-weight: 600; margin: 0 0 12px; }
  .chart-wrap { width: 100%; overflow-x: auto; }
  svg.chart { width: 100%; height: auto; min-width: 440px; display: block; }
  svg.chart text { fill: var(--sub); font-size: 12px; }
  svg.chart text.panel-title { fill: var(--text); font-size: 13px; font-weight: 600; }
  svg.chart text.val-hot { fill: var(--hot); font-weight: 600; }
  svg.chart text.val-cold { fill: var(--cold); font-weight: 600; }
  svg.chart text.val-rain { fill: var(--rain); font-weight: 600; }
  svg.chart text.val-mm { fill: var(--mm); font-weight: 600; }
  svg.chart .grid { stroke: var(--line); stroke-width: 1; }
  svg.chart .line-hot { stroke: var(--hot); fill: none; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
  svg.chart .line-cold { stroke: var(--cold); fill: none; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
  svg.chart .line-rain { stroke: var(--rain); fill: none; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
  svg.chart .area-rain { fill: var(--rain-bg); opacity: 0.7; }
  svg.chart .bar-mm { fill: var(--mm); }
  svg.chart .dot-hot { fill: var(--hot); }
  svg.chart .dot-cold { fill: var(--cold); }
  svg.chart .dot-mid { fill: var(--mid); }
  svg.chart .line-feel { stroke: var(--feel); fill: none; stroke-width: 2; stroke-dasharray: 6 4; stroke-linejoin: round; stroke-linecap: round; }
  svg.chart .dot-feel { fill: var(--feel); }
  svg.chart text.val-feel { fill: var(--feel); font-weight: 600; }
  .legend .t::before { background: linear-gradient(90deg, var(--cold), var(--mid), var(--hot)); }
  .legend .f::before { background: var(--feel); }
  svg.chart .seg { fill: none; stroke-width: 2.5; stroke-linecap: round; }
  svg.chart .seg-low { stroke: var(--cold); }
  svg.chart .seg-mid { stroke: var(--mid); }
  svg.chart .seg-high { stroke: var(--hot); }
  svg.chart .dot-rain { fill: var(--rain); }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 0.82rem; color: var(--sub); margin-top: 8px; }
  .legend span::before {
    content: "";
    display: inline-block;
    width: 12px; height: 12px;
    border-radius: 50%;
    margin-right: 6px;
    vertical-align: -1px;
  }
  .legend .h::before { background: var(--hot); }
  .legend .l::before { background: var(--cold); }
  .legend .p::before { background: var(--rain); }
  .legend .m::before { background: var(--mm); }

  .days {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
  }
  @media (max-width: 720px) {
    .days { grid-template-columns: repeat(2, 1fr); }
  }
  .day {
    background: var(--panel-2);
    border-radius: 16px;
    padding: 14px 10px;
    text-align: center;
  }
  .day .wk { font-weight: 600; font-size: 1rem; }
  .day .dt { color: var(--sub); font-size: 0.8rem; margin-top: 2px; }
  .day .ic { font-size: 2.2rem; margin: 10px 0 2px; line-height: 1.1; }
  .day .ds { color: var(--sub); font-size: 0.82rem; min-height: 1.2em; }
  .day .tp { margin-top: 10px; font-size: 1.05rem; font-variant-numeric: tabular-nums; }
  .day .tp .hi { color: var(--hot); font-weight: 600; }
  .day .tp .lo { color: var(--cold); font-weight: 600; }
  .rain-label {
    display: flex;
    justify-content: space-between;
    font-size: 0.8rem;
    color: var(--sub);
    margin-top: 12px;
  }
  .rain-label b { color: var(--rain); font-variant-numeric: tabular-nums; }
  .bar { height: 8px; background: var(--rain-bg); border-radius: 999px; overflow: hidden; margin-top: 5px; }
  .bar > i { display: block; height: 100%; background: var(--rain); border-radius: 999px; transition: width 0.4s; }

  .msg { text-align: center; padding: 36px 12px; color: var(--sub); }
  .msg.error { color: var(--err); }
  .spinner {
    width: 32px; height: 32px;
    margin: 0 auto 12px;
    border: 4px solid var(--line);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  footer { text-align: center; color: var(--sub); font-size: 0.78rem; margin-top: 8px; line-height: 1.7; }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>高雄市小港區天氣預報</h1>
      <div class="subtitle" id="updated">載入中…</div>
    </div>
    <button class="refresh" id="refreshBtn" type="button">重新整理</button>
  </header>

  <div id="status" class="card msg">
    <div class="spinner"></div>
    正在取得天氣資料…
  </div>

  <div id="content" class="hidden">
    <section class="card">
      <h2 class="section-title">今天與未來五天溫度與降雨機率</h2>
      <div class="chart-wrap" id="chart"></div>
      <div class="legend">
        <span class="h">最高溫</span>
        <span class="l">最低溫</span>
        <span class="p">降雨機率</span>
      </div>
    </section>

    <section class="card">
      <h2 class="section-title">今天至未來 3 天溫度、體感溫度與時雨量(每 3 小時)</h2>
      <div class="chart-wrap" id="hourly"></div>
      <div class="legend"><span class="t">溫度</span><span class="f">體感溫度(虛線)</span><span class="m">時雨量</span></div>
    </section>
  </div>

  <footer>
    資料來源:Open-Meteo(預報模型資料,僅供參考)<br>
    降雨機率為當日最大值,時雨量為單一小時降雨量(mm),溫度單位為攝氏(°C)
  </footer>
</div>

<script>
(function () {
  var LAT = 22.5660;
  var LON = 120.3450;
  var API = "https://api.open-meteo.com/v1/forecast"
    + "?latitude=" + LAT
    + "&longitude=" + LON
    + "&current=temperature_2m,weather_code"
    + "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max"
    + "&hourly=temperature_2m,apparent_temperature,precipitation"
    + "&timezone=Asia%2FTaipei"
    + "&forecast_days=6";

  // 資料含今天(索引0)與未來五天。上方圖表顯示全部 6 天。
  var FIRST_DAY = 0;
  var LAST_DAY = 6; // 不含
  var todayKey = "";
  // 下方逐時圖只標示低於 LOW_LIMIT 或高於 HIGH_LIMIT 的溫度
  var LOW_LIMIT = 21;
  var HIGH_LIMIT = 28;
  // 下方逐時圖的體感溫度,只標示低於 FEEL_LOW_LIMIT 或高於 FEEL_HIGH_LIMIT 的數字
  var FEEL_LOW_LIMIT = 23;
  var FEEL_HIGH_LIMIT = 28;
  function feelFlag(v) { return v < FEEL_LOW_LIMIT || v > FEEL_HIGH_LIMIT; }
  // 時雨量超過此值(mm)才標示數字
  var RAIN_LIMIT = 1;

  var WEEK = ["週日", "週一", "週二", "週三", "週四", "週五", "週六"];

  var statusEl = document.getElementById("status");
  var contentEl = document.getElementById("content");
  var chartEl = document.getElementById("chart");
  var hourlyEl = document.getElementById("hourly");
  var updatedEl = document.getElementById("updated");
  var btn = document.getElementById("refreshBtn");

  function weatherInfo(code) {
    if (code === 0) return { icon: "☀️", text: "晴天" };
    if (code === 1) return { icon: "🌤️", text: "大致晴朗" };
    if (code === 2) return { icon: "⛅", text: "多雲" };
    if (code === 3) return { icon: "☁️", text: "陰天" };
    if (code === 45 || code === 48) return { icon: "🌫️", text: "有霧" };
    if (code >= 51 && code <= 55) return { icon: "🌦️", text: "毛毛雨" };
    if (code === 56 || code === 57) return { icon: "🌧️", text: "凍毛毛雨" };
    if (code === 61) return { icon: "🌦️", text: "小雨" };
    if (code === 63) return { icon: "🌧️", text: "中雨" };
    if (code === 65) return { icon: "🌧️", text: "大雨" };
    if (code === 66 || code === 67) return { icon: "🌧️", text: "凍雨" };
    if (code >= 71 && code <= 77) return { icon: "🌨️", text: "降雪" };
    if (code === 80) return { icon: "🌦️", text: "短暫陣雨" };
    if (code === 81) return { icon: "🌧️", text: "陣雨" };
    if (code === 82) return { icon: "⛈️", text: "強陣雨" };
    if (code === 85 || code === 86) return { icon: "🌨️", text: "陣雪" };
    if (code === 95) return { icon: "⛈️", text: "雷雨" };
    if (code === 96 || code === 99) return { icon: "⛈️", text: "雷雨伴冰雹" };
    return { icon: "❔", text: "未知" };
  }

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined && text !== null) e.textContent = text;
    return e;
  }

  function parseDate(s) {
    var p = s.split("-");
    return new Date(parseInt(p[0], 10), parseInt(p[1], 10) - 1, parseInt(p[2], 10));
  }

  function fmtTemp(v) {
    return (v === null || v === undefined) ? "—" : Math.round(v) + "°";
  }

  function fmtMm(v) {
    if (v === null || v === undefined) return "—";
    return (Math.round(v * 10) / 10) + " mm";
  }

  function showLoading() {
    statusEl.className = "card msg";
    statusEl.innerHTML = "";
    statusEl.appendChild(el("div", "spinner"));
    statusEl.appendChild(document.createTextNode("正在取得天氣資料…"));
    statusEl.classList.remove("hidden");
    contentEl.classList.add("hidden");
    btn.disabled = true;
  }

  function showError(message) {
    statusEl.className = "card msg error";
    statusEl.innerHTML = "";
    statusEl.appendChild(el("div", null, "無法取得天氣資料"));
    statusEl.appendChild(el("div", null, message));
    statusEl.appendChild(el("div", null, "請檢查網路連線後,按右上角「重新整理」再試一次。"));
    statusEl.classList.remove("hidden");
    contentEl.classList.add("hidden");
    updatedEl.textContent = "更新失敗";
    btn.disabled = false;
  }

  function buildDays(daily) {
    var list = [];
    for (var i = 0; i < daily.time.length; i++) {
      list.push({
        date: daily.time[i],
        code: daily.weather_code[i],
        max: daily.temperature_2m_max[i],
        min: daily.temperature_2m_min[i],
        rain: daily.precipitation_probability_max[i]
      });
    }
    return list;
  }

  function svgEl(name, attrs) {
    var n = document.createElementNS("http://www.w3.org/2000/svg", name);
    for (var k in attrs) {
      if (Object.prototype.hasOwnProperty.call(attrs, k)) n.setAttribute(k, attrs[k]);
    }
    return n;
  }

  function renderChart(days) {
    chartEl.innerHTML = "";
    var W = 640, H = 390;
    var padL = 44, padR = 44;
    var n = days.length;

    // 兩個面板的垂直範圍:[上, 下]
    var P1 = [34, 200];   // 溫度
    var P2 = [262, 352];  // 降雨機率

    var svg = svgEl("svg", { "class": "chart", viewBox: "0 0 " + W + " " + H, role: "img", "aria-label": "今天與未來五天溫度與降雨機率圖表" });

    function xAt(i) {
      if (n === 1) return W / 2;
      return padL + i * (W - padL - padR) / (n - 1);
    }
    function scale(panel, lo, hi) {
      return function (v) { return panel[1] - (v - lo) * (panel[1] - panel[0]) / (hi - lo); };
    }
    function title(text, y) {
      var t = svgEl("text", { "class": "panel-title", x: padL - 34, y: y });
      t.textContent = text;
      svg.appendChild(t);
    }
    function grid(panel, lo, hi, steps, fmt, yAt) {
      for (var g = 0; g <= steps; g++) {
        var val = lo + (hi - lo) * g / steps;
        var y = yAt(val);
        svg.appendChild(svgEl("line", { "class": "grid", x1: padL - 6, x2: W - padR + 6, y1: y, y2: y }));
        var t = svgEl("text", { x: padL - 10, y: y + 4, "text-anchor": "end" });
        t.textContent = fmt(val);
        svg.appendChild(t);
      }
    }

    // ---- 面板 1:溫度 ----
    var maxes = days.map(function (d) { return d.max; });
    var mins = days.map(function (d) { return d.min; });
    var tLo = Math.floor(Math.min.apply(null, mins) - 2);
    var tHi = Math.ceil(Math.max.apply(null, maxes) + 2);
    if (tHi === tLo) tHi = tLo + 1;
    var yT = scale(P1, tLo, tHi);
    title("溫度 (°C)", 16);
    grid(P1, tLo, tHi, 4, function (v) { return Math.round(v) + "°"; }, yT);

    function polyline(values, yAt, cls) {
      var pts = values.map(function (v, i) { return xAt(i) + "," + yAt(v); }).join(" ");
      svg.appendChild(svgEl("polyline", { "class": cls, points: pts }));
    }
    polyline(maxes, yT, "line-hot");
    polyline(mins, yT, "line-cold");

    days.forEach(function (d, i) {
      var x = xAt(i);
      svg.appendChild(svgEl("circle", { "class": "dot-hot", cx: x, cy: yT(d.max), r: 4.5 }));
      svg.appendChild(svgEl("circle", { "class": "dot-cold", cx: x, cy: yT(d.min), r: 4.5 }));
      var th = svgEl("text", { "class": "val-hot", x: x, y: yT(d.max) - 10, "text-anchor": "middle" });
      th.textContent = fmtTemp(d.max);
      svg.appendChild(th);
      var tl = svgEl("text", { "class": "val-cold", x: x, y: yT(d.min) + 20, "text-anchor": "middle" });
      tl.textContent = fmtTemp(d.min);
      svg.appendChild(tl);
    });

    // ---- 面板 2:降雨機率 ----
    var yP = scale(P2, 0, 100);
    title("降雨機率 (%)", 244);
    grid(P2, 0, 100, 2, function (v) { return Math.round(v) + "%"; }, yP);

    var probs = days.map(function (d) { return (d.rain === null || d.rain === undefined) ? 0 : d.rain; });
    if (n > 1) {
      var areaPts = probs.map(function (v, i) { return xAt(i) + "," + yP(v); });
      areaPts.push(xAt(n - 1) + "," + yP(0));
      areaPts.push(xAt(0) + "," + yP(0));
      svg.appendChild(svgEl("polygon", { "class": "area-rain", points: areaPts.join(" ") }));
    }
    polyline(probs, yP, "line-rain");
    days.forEach(function (d, i) {
      var x = xAt(i);
      var has = !(d.rain === null || d.rain === undefined);
      svg.appendChild(svgEl("circle", { "class": "dot-rain", cx: x, cy: yP(probs[i]), r: 4.5 }));
      var ty = yP(probs[i]) - 10;
      if (ty < P2[0] + 4) ty = yP(probs[i]) + 20;
      var t = svgEl("text", { "class": "val-rain", x: x, y: ty, "text-anchor": "middle" });
      t.textContent = has ? d.rain + "%" : "—";
      svg.appendChild(t);
    });

    // ---- X 軸日期標籤 ----
    days.forEach(function (d, i) {
      var x = xAt(i);
      var dt = parseDate(d.date);
      var lab = svgEl("text", { x: x, y: H - 14, "text-anchor": "middle" });
      var tag = WEEK[dt.getDay()];
      if (d.date === todayKey) tag = "今天";
      lab.textContent = (dt.getMonth() + 1) + "/" + dt.getDate() + " " + tag;
      svg.appendChild(lab);
    });

    chartEl.appendChild(svg);
  }

  function renderHourly(data) {
    hourlyEl.innerHTML = "";
    var h = data.hourly;
    if (!h || !h.time || !h.temperature_2m) return;

    var curTime = (data.current && data.current.time) ? data.current.time : h.time[0];
    var idx = h.time.indexOf(curTime.slice(0, 13) + ":00");
    if (idx < 0) idx = 0;

    var pts = [];
    var nowI = -1;
    for (var j = idx % 3; j <= idx + 72 && j < h.time.length; j += 3) {
      if (h.temperature_2m[j] === null || h.temperature_2m[j] === undefined) continue;
      if (j === idx) nowI = pts.length;
      // 時雨量:取該點前 3 小時內最大的單一小時降雨量
      var rmm = 0;
      if (h.precipitation) {
        for (var q = Math.max(0, j - 2); q <= j; q++) {
          var pv = h.precipitation[q];
          if (pv !== null && pv !== undefined && pv > rmm) rmm = pv;
        }
      }
      var feel = h.apparent_temperature ? h.apparent_temperature[j] : null;
      pts.push({ time: h.time[j], temp: h.temperature_2m[j], feel: (feel === undefined ? null : feel), mm: rmm });
    }
    if (pts.length === 0) return;

    var W = Math.max(1000, pts.length * 44), H = 330;
    var padL = 40, padR = 30, padT = 30, padB = 46;
    var tempBottom = 190;           // 溫度面板下緣
    var rainTop = 222, rainBottom = 276; // 時雨量面板
    var temps = [];
    pts.forEach(function (p) {
      temps.push(p.temp);
      if (p.feel !== null) temps.push(p.feel);
    });
    var lo = Math.floor(Math.min.apply(null, temps) - 1);
    var hi = Math.ceil(Math.max.apply(null, temps) + 1);
    if (hi <= lo) hi = lo + 1;

    var svg = svgEl("svg", { "class": "chart", viewBox: "0 0 " + W + " " + H, role: "img", "aria-label": "今天至未來 3 天每 3 小時溫度與時雨量圖" });
    svg.style.minWidth = Math.round(W * 0.9) + "px";

    function xAt(i) {
      if (pts.length === 1) return W / 2;
      return padL + i * (W - padL - padR) / (pts.length - 1);
    }
    function yAt(v) {
      return padT + (hi - v) * (tempBottom - padT) / (hi - lo);
    }

    var steps = 4;
    for (var g = 0; g <= steps; g++) {
      var val = lo + (hi - lo) * g / steps;
      var y = yAt(val);
      svg.appendChild(svgEl("line", { "class": "grid", x1: padL - 6, x2: W - padR + 6, y1: y, y2: y }));
      var t = svgEl("text", { x: padL - 10, y: y + 4, "text-anchor": "end" });
      t.textContent = Math.round(val) + "°";
      svg.appendChild(t);
    }

    // 線段依溫度分三色:低於 LOW_LIMIT、介於兩者之間、高於 HIGH_LIMIT。
    // 線段跨越門檻時,在交界處切開,各段分別上色。
    function zoneOf(t) {
      if (t < LOW_LIMIT) return "seg-low";
      if (t > HIGH_LIMIT) return "seg-high";
      return "seg-mid";
    }
    function drawSeg(x1, t1, x2, t2) {
      var zone = zoneOf((t1 + t2) / 2);
      svg.appendChild(svgEl("line", { "class": "seg " + zone, x1: x1, y1: yAt(t1), x2: x2, y2: yAt(t2) }));
    }
    for (var si = 0; si < pts.length - 1; si++) {
      var xa = xAt(si), xb = xAt(si + 1);
      var ta = pts[si].temp, tb = pts[si + 1].temp;
      var cuts = [0, 1];
      [LOW_LIMIT, HIGH_LIMIT].forEach(function (lim) {
        if ((ta - lim) * (tb - lim) < 0) cuts.push((lim - ta) / (tb - ta));
      });
      cuts.sort(function (a, b) { return a - b; });
      for (var ci = 0; ci < cuts.length - 1; ci++) {
        var f1 = cuts[ci], f2 = cuts[ci + 1];
        drawSeg(xa + (xb - xa) * f1, ta + (tb - ta) * f1, xa + (xb - xa) * f2, ta + (tb - ta) * f2);
      }
    }

    if (nowI >= 0) {
      var nx = xAt(nowI);
      svg.appendChild(svgEl("line", { x1: nx, x2: nx, y1: padT - 12, y2: rainBottom + 4, stroke: "var(--accent)", "stroke-width": 1.5, "stroke-dasharray": "4 4" }));
      var nt = svgEl("text", { x: nx, y: padT - 16, "text-anchor": "middle" });
      nt.textContent = "現在";
      svg.appendChild(nt);
    }

    // ---- 體感溫度:紫色虛線,只標示高於/低於門檻的點 ----
    var feelPts = [];
    pts.forEach(function (p, i) { if (p.feel !== null) feelPts.push({ i: i, v: p.feel }); });
    if (feelPts.length > 1) {
      var fl = feelPts.map(function (q) { return xAt(q.i) + "," + yAt(q.v); }).join(" ");
      svg.appendChild(svgEl("polyline", { "class": "line-feel", points: fl }));
    }
    pts.forEach(function (p, i) {
      if (p.feel === null || !feelFlag(p.feel)) return;
      // 體感高於實際溫度時數字放上方,否則放下方,盡量避開實際溫度的數字
      var up = p.feel >= p.temp;
      var ft = svgEl("text", { "class": "val-feel", x: xAt(i), y: yAt(p.feel) + (up ? -10 : 20), "text-anchor": "middle" });
      ft.textContent = fmtTemp(p.feel);
      svg.appendChild(ft);
    });

    // ---- 時雨量面板 ----
    var rainMax = Math.max(2, Math.ceil(Math.max.apply(null, pts.map(function (p) { return p.mm; }))));
    function yR(v) { return rainBottom - v * (rainBottom - rainTop) / rainMax; }
    var rt = svgEl("text", { "class": "panel-title", x: padL - 34, y: rainTop - 12 });
    rt.textContent = "時雨量 (mm)";
    svg.appendChild(rt);
    svg.appendChild(svgEl("line", { "class": "grid", x1: padL - 6, x2: W - padR + 6, y1: rainBottom, y2: rainBottom }));
    var bw = Math.min(26, (W - padL - padR) / Math.max(pts.length, 1) * 0.5);
    pts.forEach(function (p, i) {
      if (!(p.mm > 0)) return;
      var x = xAt(i);
      var bh = Math.max(rainBottom - yR(p.mm), 2);
      svg.appendChild(svgEl("rect", { "class": "bar-mm", x: x - bw / 2, y: rainBottom - bh, width: bw, height: bh, rx: 3 }));
      if (p.mm > RAIN_LIMIT) {
        var rl = svgEl("text", { "class": "val-mm", x: x, y: rainBottom - bh - 6, "text-anchor": "middle" });
        rl.textContent = (Math.round(p.mm * 10) / 10) + "";
        svg.appendChild(rl);
      }
    });

    var prevDate = "";
    pts.forEach(function (p, i) {
      var x = xAt(i);
      var isLow = p.temp < LOW_LIMIT;
      var isHigh = p.temp > HIGH_LIMIT;
      var flagged = isLow || isHigh;
      svg.appendChild(svgEl("circle", { "class": isLow ? "dot-cold" : (isHigh ? "dot-hot" : "dot-mid"), cx: x, cy: yAt(p.temp), r: flagged ? 5 : 3 }));

      if (flagged) {
        var tv = svgEl("text", { "class": isLow ? "val-cold" : "val-hot", x: x, y: isLow ? yAt(p.temp) + 20 : yAt(p.temp) - 10, "text-anchor": "middle" });
        tv.textContent = fmtTemp(p.temp);
        svg.appendChild(tv);
      }

      var hh = p.time.slice(11, 13) + ":00";
      var tl = svgEl("text", { x: x, y: H - 22, "text-anchor": "middle" });
      tl.textContent = hh;
      svg.appendChild(tl);

      var dateStr = p.time.slice(0, 10);
      if (dateStr !== prevDate) {
        var dt = parseDate(dateStr);
        var dl = svgEl("text", { x: x, y: H - 6, "text-anchor": "middle" });
        dl.textContent = (dt.getMonth() + 1) + "/" + dt.getDate() + " " + WEEK[dt.getDay()];
        svg.appendChild(dl);
        prevDate = dateStr;
      }
    });

    hourlyEl.appendChild(svg);
  }

  function render(data) {
    if (!data || !data.daily || !data.daily.time || data.daily.time.length === 0) {
      showError("伺服器回傳的資料格式不正確。");
      return;
    }
    var all = buildDays(data.daily);
    var next = all.slice(FIRST_DAY, LAST_DAY);
    todayKey = (data.current && data.current.time) ? data.current.time.slice(0, 10) : "";

    renderChart(next);
    renderHourly(data);

    var now = new Date();
    var hh = ("0" + now.getHours()).slice(-2);
    var mm = ("0" + now.getMinutes()).slice(-2);
    updatedEl.textContent = "最後更新:" + (now.getMonth() + 1) + "/" + now.getDate() + " " + hh + ":" + mm;

    statusEl.classList.add("hidden");
    contentEl.classList.remove("hidden");
    btn.disabled = false;
  }

  var CACHE_KEY = "kh-weather-cache-v1";
  var TIMEOUTS = [15000, 20000, 25000]; // 每次嘗試的逾時時間,最多重試 3 次
  var loading = false;
  var lastOk = 0; // 上次成功取得資料的時間

  function fetchOnce(timeoutMs) {
    var controller = (typeof AbortController !== "undefined") ? new AbortController() : null;
    var timer = setTimeout(function () { if (controller) controller.abort(); }, timeoutMs);
    return fetch(API, controller ? { signal: controller.signal } : undefined)
      .then(function (res) {
        if (!res.ok) throw new Error("伺服器回應錯誤(狀態碼 " + res.status + ")");
        return res.json();
      })
      .then(function (data) {
        clearTimeout(timer);
        return data;
      }, function (err) {
        clearTimeout(timer);
        throw err;
      });
  }

  function wait(ms) {
    return new Promise(function (resolve) { setTimeout(resolve, ms); });
  }

  function saveCache(data) {
    try { localStorage.setItem(CACHE_KEY, JSON.stringify({ t: Date.now(), data: data })); } catch (e) {}
  }

  function readCache() {
    try {
      var raw = localStorage.getItem(CACHE_KEY);
      if (!raw) return null;
      var obj = JSON.parse(raw);
      return (obj && obj.data && obj.t) ? obj : null;
    } catch (e) { return null; }
  }

  function tryFetch(attempt, lastErr) {
    if (attempt >= TIMEOUTS.length) return Promise.reject(lastErr);
    return fetchOnce(TIMEOUTS[attempt]).catch(function (err) {
      return wait(1000).then(function () { return tryFetch(attempt + 1, err); });
    });
  }

  function load() {
    if (loading) return;
    loading = true;
    showLoading();

    tryFetch(0, null)
      .then(function (data) {
        saveCache(data);
        lastOk = Date.now();
        render(data);
      })
      .catch(function (err) {
        var msg = (err && err.name === "AbortError") ? "連線逾時。" : (err && err.message ? err.message : "發生未知錯誤。");
        var cached = readCache();
        if (cached) {
          // 網路不穩時,先顯示上次成功取得的資料
          render(cached.data);
          var d = new Date(cached.t);
          var hh = ("0" + d.getHours()).slice(-2);
          var mm = ("0" + d.getMinutes()).slice(-2);
          updatedEl.textContent = "連線失敗,顯示 " + (d.getMonth() + 1) + "/" + d.getDate() + " " + hh + ":" + mm + " 的舊資料";
        } else {
          showError(msg);
        }
      })
      .then(function () {
        loading = false;
        btn.disabled = false;
      });
  }

  btn.addEventListener("click", load);

  // 手機瀏覽器常把分頁凍結在背景,切回來時請求會逾時或資料過舊,所以回到前景時自動更新
  function refreshIfStale(maxAgeMs) {
    if (!lastOk || Date.now() - lastOk > maxAgeMs) load();
  }
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible") refreshIfStale(10 * 60 * 1000);
  });
  window.addEventListener("pageshow", function (e) {
    if (e.persisted) refreshIfStale(10 * 60 * 1000);
  });
  window.addEventListener("online", function () {
    refreshIfStale(60 * 1000);
  });
  load();
})();
</script>
</body>
</html>
